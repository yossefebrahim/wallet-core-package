  - id: ethereum-sign-eip1559-1
    coin: ethereum
    operation: sign
    variant: eip1559
    source:
      kind: upstream_test
      path: tests/chains/Ethereum/TWAnySignerTests.cpp
      commit: d692ac27749d0c615e17c751b70ab4f0aa75c59b
      # TEST(TWAnySignerEthereum, SignERC1559Transfer_1442), lines 313-349.
      # The test also links the broadcast transaction
      # ropsten.etherscan.io/tx/0x14429509307efebfdaa05227d84c147450d168c68539351fbc01ed87c916ab2e
      # in a comment. That hash is NOT asserted by the test, so it is
      # deliberately not carried as an expected value here.
    input:
      chain_id: "3" # Converted from uint256_t(3)
      nonce: "6" # Converted from uint256_t(6)
      max_priority_fee_per_gas: "2000000000" # Converted from uint256_t(2000000000)
      max_fee_per_gas: "3000000000" # Converted from uint256_t(3000000000)
      gas_limit: "21100" # Converted from uint256_t(21100)
      to_address: "0xB9F5771C27664bF2282D98E09D7F50cEc7cB01a7"
      value: "543210987654321" # Converted from uint256_t(543210987654321)
      data: "" # transfer.set_data(Data().data(), 0)
      # Upstream's published test key for this vector, read from the same test
      # function (`auto key = parse_hex(...)`). Chain id 3 is Ropsten, a
      # deprecated testnet; this key has never held mainnet value. Without it
      # the vector cannot be executed, because the expected bytes below are the
      # signature this key produces.
      private_key: "4f96ed80e9a7555a6f74b3d658afdd9c756b0a40d4ca30c42c2039eb449bb904"
    expected:
      encoded: "02f8710306847735940084b2d05e0082526c94b9f5771c27664bf2282d98e09d7f50cec7cb01a78701ee0c29f50cb180c080a092c336138f7d0231fe9422bb30ee9ef10bf222761fe9e04442e3a11e88880c64a06487026011dae03dc281bc21c7d7ede5c2226d197befb813a4ecad686b559e58"
      # The remaining three are asserted by the same upstream test and are what
      # DECISION-13's EvmSignResult exposes, so the vector checks the parsed
      # result and not only the raw bytes.
      v: "00"
      r: "92c336138f7d0231fe9422bb30ee9ef10bf222761fe9e04442e3a11e88880c64"
      s: "6487026011dae03dc281bc21c7d7ede5c2226d197befb813a4ecad686b559e58"
    platforms_verified: []

  - id: ethereum-sign_message-personal-1
    coin: ethereum
    operation: sign_message
    variant: personal
    source:
      kind: upstream_test
      path: tests/chains/Ethereum/EthereumMessageSignerTests.cpp
      commit: d692ac27749d0c615e17c751b70ab4f0aa75c59b
      # TEST(TWEthereumMessageSigner, SignAndVerifyLegacy), lines 162-171.
      # Entry point exercised: TWEthereumMessageSignerSignMessage (the C
      # TWEthereumMessageSigner API), legacy variant, no chain id.
      # The same message, key, message type and signature are also asserted
      # through the protobuf entry point (Ethereum.MessageSigningInput with
      # MessageType_legacy, via tw_message_signer_sign) by
      # rust/tw_tests/tests/chains/ethereum/ethereum_message_sign.rs,
      # test_tw_message_signer_sign, lines 14-37.
    input:
      # UTF-8 text, passed as STRING("Foo"); not hex bytes.
      message: "Foo"
      # Upstream's published test key, set in the same test function
      # (`const auto privKeyData = ...`); also used by the Rust test above.
      private_key: "03a9ca895dca1623c7dfd69693f7b4111f5d819d2e145536e0b03c136025a25d"
      # TWEthereumMessageSignerSignMessage takes no message type or chain id.
      # It is the legacy variant (MessageType::Legacy in the C++ test at lines
      # 124-131; MessageType_legacy in the Rust protobuf test): the trailing
      # byte of the signature below is 1b, with no EIP-155 chain id applied.
      message_type: "legacy"
    expected:
      # The string the test asserts, unchanged (r || s || v, lowercase hex).
      signature: "21a779d499957e7fd39392d49a079679009e60e492d9654a148829be43d2490736ec72bc4a5644047d979c3cf4ebe2c1c514044cf436b063cb89fc6676be71101b"
      # Asserted by the same test:
      # EXPECT_TRUE(TWEthereumMessageSignerVerifyMessage(pubKey, message, signature)),
      # with pubKey derived by the test from the key above.
      verify_message: true
    platforms_verified: []

  - id: ethereum-sign_message-eip712-1
    coin: ethereum
    operation: sign_message
    variant: eip712
    source:
      kind: upstream_test
      path: tests/chains/Ethereum/EthereumMessageSignerTests.cpp
      commit: d692ac27749d0c615e17c751b70ab4f0aa75c59b
      # TEST(TWEthereumEip712, SignMessageAndVerifyLegacy), lines 184-217.
      # Entry point exercised: TWEthereumMessageSignerSignTypedMessage (the C
      # TWEthereumMessageSigner API), legacy variant, no chain id argument.
      # Upstream has no test of EIP-712 signing through the protobuf
      # MessageSigningInput entry point.
    input:
      # The JSON is the raw string literal R"(...)" of the test, unchanged
      # except that the literal's leading newline and common 12-space indent
      # are removed by the YAML block scalar (JSON whitespace is not
      # significant). Note domain.chainId is 0 inside the typed data.
      typed_data: |
        {
            "types": {
                "EIP712Domain": [
                    {"name": "name", "type": "string"},
                    {"name": "version", "type": "string"},
                    {"name": "chainId", "type": "uint256"},
                    {"name": "verifyingContract", "type": "address"}
                ],
                "Person": [
                    {"name": "name", "type": "string"},
                    {"name": "wallet", "type": "address"}
                ]
            },
            "primaryType": "Person",
            "domain": {
                "name": "Ether Person",
                "version": "1",
                "chainId": 0,
                "verifyingContract": "0xCcCCccccCCCCcCCCCCCcCcCccCcCCCcCcccccccC"
            },
            "message": {
                "name": "Cow",
                "wallet": "CD2a3d9F938E13CD947Ec05AbC7FE734Df8DD826"
            }
        }
      # Upstream's published test key, set in the same test function
      # (`const auto privKeyData = ...`).
      private_key: "03a9ca895dca1623c7dfd69693f7b4111f5d819d2e145536e0b03c136025a25d"
      # TWEthereumMessageSignerSignTypedMessage takes no message type or chain
      # id argument. It is the legacy variant (the C++ twin test at lines
      # 24-56 passes MessageType::Legacy): the trailing byte of the signature
      # below is 1c, with no EIP-155 chain id applied.
      message_type: "legacy"
    expected:
      # The string the test asserts, unchanged (r || s || v, lowercase hex).
      signature: "446434e4c34d6b7456e5f07a1b994b88bf85c057234c68d1e10c936b1c85706c4e19147c0ac3a983bc2d56ebfd7146f8b62bcea6114900fe8e7d7351f44bf3761c"
      # Asserted by the same test:
      # EXPECT_TRUE(TWEthereumMessageSignerVerifyMessage(pubKey, msg, signature)),
      # with pubKey derived by the test from the key above.
      verify_message: true
    platforms_verified: []
