vectors:
  - id: bitcoin-address-n/a-1
    coin: bitcoin
    operation: address
    variant: n/a
    source:
      kind: upstream_test
      path: tests/interface/TWHDWalletTests.cpp
      commit: d692ac27749d0c615e17c751b70ab4f0aa75c59b
      # TEST(TWHDWallet, Derive_XpubPub_vs_PrivPub), lines 560-589, the
      # "-> privateKey -> publicKey" block for derivPath1 (lines 575-582).
      # The mnemonic is `wordsStr` (line 28, gWords); the test creates the wallet
      # with an empty passphrase (line 565). The address is the bech32 P2WPKH
      # address (TWSegwitAddressCreateWithPublicKey, TWHRPBitcoin).
    input:
      mnemonic: "ripple scissors kick mammal hire column oak again sun offer wealth tomorrow wagon turn fatal"
      passphrase: ""
      derivation_path: "m/84'/0'/0'/0/0"
    expected:
      address: "bc1qpsp72plnsqe6e2dvtsetxtww2cz36ztmfxghpd"
      public_key: "02df9ef2a7a5552765178b181e1e1afdefc7849985c7dfe9647706dd4fa40df6ac"
    platforms_verified: [android, ios]

  - id: bitcoin-address-n/a-2
    coin: bitcoin
    operation: address
    variant: n/a
    source:
      kind: upstream_test
      path: tests/interface/TWHDWalletTests.cpp
      commit: d692ac27749d0c615e17c751b70ab4f0aa75c59b
      # TEST(TWHDWallet, Derive_XpubPub_vs_PrivPub), lines 560-589, the
      # "-> privateKey -> publicKey" block for derivPath2 (lines 583-589).
      # Same mnemonic and empty passphrase as bitcoin-address-n/a-1.
    input:
      mnemonic: "ripple scissors kick mammal hire column oak again sun offer wealth tomorrow wagon turn fatal"
      passphrase: ""
      derivation_path: "m/84'/0'/0'/0/2"
    expected:
      address: "bc1q7zddsunzaftf4zlsg9exhzlkvc5374a6v32jf6"
      public_key: "031e1f64d2f6768dccb6814545b2e2d58e26ad5f91b7cbaffe881ed572c65060db"
    platforms_verified: [android, ios]

  - id: bitcoin-plan-p2wpkh-1
    coin: bitcoin
    operation: plan
    variant: p2wpkh
    source:
      kind: upstream_test
      path: tests/chains/Bitcoin/TWBitcoinSigningTests.cpp
      commit: d692ac27749d0c615e17c751b70ab4f0aa75c59b
      # TEST(BitcoinSigning, SignPlanTransactionNoChange), lines 476-552 (plan
      # assertions at 546-552). The same test signs the identical signingInput
      # (bitcoin-sign-p2wpkh-1 carries the same input block, lines 476-558).
    input:
      hash_type: "1" # TWBitcoinSigHashTypeAll = 0x01 (set_hash_type, line 510)
      byte_fee: "33"
      # `sendAmount = 28235 - dustChange` with `dustChange = 200` (lines 505-506),
      # evaluated to a decimal string.
      amount: "28035"
      use_max_amount: false # not set by the test (proto default)
      to_address: "bc1q2dsdlq3343vk29runkgv4yc292hmq53jedfjmp"
      change_address: "bc1qvrt7ukvhvmdny0a3j9k8l8jasx92lrqm30t2u2"
      fixed_dust_threshold: "546" # `dustAmount` (line 503), set_fixed_dust_threshold (line 515)
      # Upstream's published test key (line 477), the same one used for every
      # UTXO below. The address derived from it appears in upstream's comment as
      # having broadcast a mainnet transaction, so the key must be treated as
      # publicly known and never funded.
      utxos:
        - txid: "b33082a5fad105c1d9712e8d503971fe4d84713065bd323fd1019636ed940e8d" # display order, as written in the test (line 485); the test reverses it before set_hash (line 486)
          index: "1"
          amount: "30269"
          sequence: "4294967295" # UINT32_MAX
          # Not a literal in the C++ test: it builds the script with
          # Script::buildPayToWitnessPublicKeyHash(ripemd(sha256(pubkey))) (line 480).
          # The same hex appears as a literal in the Rust test
          # rust/tw_tests/tests/chains/bitcoin/bitcoin_sign/p2wpkh.rs line 20
          # (`custom_redeem_script`, "A redeem script for any P2WPKH UTXO sent to my
          # address") for the same key, address, outpoints and amounts, and as the
          # output script paid to bc1qvrt7... in TEST(BitcoinSigning,
          # SpendMinimumAmountP2WPKH), lines 142-144.
          script_pub_key: "001460d7ee599766db323fb1916c7f9e5d818aaf8c1b"
          private_key: "9ea2172511ed73ae0096be8e593c3b75631700edaf729f1abbae607314a20e35"
        - txid: "1f62c18bfc5f8293a2b7b061587c427bf830fb224289f9a806e6ad48de6a4c7d" # display order (line 491), reversed by the test (line 492)
          index: "1"
          amount: "4863"
          sequence: "4294967295"
          script_pub_key: "001460d7ee599766db323fb1916c7f9e5d818aaf8c1b" # see the first UTXO
          private_key: "9ea2172511ed73ae0096be8e593c3b75631700edaf729f1abbae607314a20e35"
        - txid: "71c3343dfca5f1914e1bfc04153517d73650cb9c931e8511d24d1f5290120f6f" # display order (line 497), reversed by the test (line 498)
          index: "0"
          amount: "300" # "This UTXO will be filtered out as less than dust" (line 499)
          sequence: "4294967295"
          script_pub_key: "001460d7ee599766db323fb1916c7f9e5d818aaf8c1b" # see the first UTXO
          private_key: "9ea2172511ed73ae0096be8e593c3b75631700edaf729f1abbae607314a20e35"
    expected:
      # EXPECT_TRUE(verifyPlan(plan, {4863, 30269}, sendAmount, fee)), line 552,
      # with `fee = 6897 + dustChange` (line 550), evaluated to a decimal string.
      # The amounts are in the selected order, which verifySelectedUTXOs checks
      # position by position.
      selected_utxo_amounts: ["4863", "30269"]
      amount: "28035"
      fee: "7097"
      # The two values below are not literals in the test: verifyPlan
      # (tests/chains/Bitcoin/TxComparisonHelper.cpp lines 104-117) asserts
      # availableAmount == sum(utxoAmounts) and
      # change == sum(utxoAmounts) - outputAmount - fee, which for these
      # arguments are 35132 and 0. The test's own comment (line 475) says there
      # must be no change output here.
      available_amount: "35132"
      change: "0"
    platforms_verified: [android, ios]

  - id: bitcoin-sign-p2wpkh-1
    coin: bitcoin
    operation: sign
    variant: p2wpkh
    source:
      kind: upstream_test
      path: tests/chains/Bitcoin/TWBitcoinSigningTests.cpp
      commit: d692ac27749d0c615e17c751b70ab4f0aa75c59b
      # TEST(BitcoinSigning, SignPlanTransactionNoChange), lines 476-558 (sign
      # assertions at 554-558). The test calls ANY_SIGN on the same signingInput
      # it planned, without feeding the plan back, so the signer plans
      # internally; the input block is identical to bitcoin-plan-p2wpkh-1.
    input:
      hash_type: "1" # TWBitcoinSigHashTypeAll = 0x01 (line 510)
      byte_fee: "33"
      amount: "28035" # `28235 - 200` (lines 505-506)
      use_max_amount: false # not set by the test (proto default)
      to_address: "bc1q2dsdlq3343vk29runkgv4yc292hmq53jedfjmp"
      change_address: "bc1qvrt7ukvhvmdny0a3j9k8l8jasx92lrqm30t2u2"
      fixed_dust_threshold: "546"
      # Same published test key as bitcoin-plan-p2wpkh-1; see the notes there.
      utxos:
        - txid: "b33082a5fad105c1d9712e8d503971fe4d84713065bd323fd1019636ed940e8d" # display order; the test reverses it before set_hash
          index: "1"
          amount: "30269"
          sequence: "4294967295"
          script_pub_key: "001460d7ee599766db323fb1916c7f9e5d818aaf8c1b" # provenance as in bitcoin-plan-p2wpkh-1
          private_key: "9ea2172511ed73ae0096be8e593c3b75631700edaf729f1abbae607314a20e35"
        - txid: "1f62c18bfc5f8293a2b7b061587c427bf830fb224289f9a806e6ad48de6a4c7d" # display order; reversed by the test
          index: "1"
          amount: "4863"
          sequence: "4294967295"
          script_pub_key: "001460d7ee599766db323fb1916c7f9e5d818aaf8c1b"
          private_key: "9ea2172511ed73ae0096be8e593c3b75631700edaf729f1abbae607314a20e35"
        - txid: "71c3343dfca5f1914e1bfc04153517d73650cb9c931e8511d24d1f5290120f6f" # display order; reversed by the test
          index: "0"
          amount: "300"
          sequence: "4294967295"
          script_pub_key: "001460d7ee599766db323fb1916c7f9e5d818aaf8c1b"
          private_key: "9ea2172511ed73ae0096be8e593c3b75631700edaf729f1abbae607314a20e35"
    expected:
      encoded: ""
      # Not asserted by the cited C++ test (its mempool.space link at line 557 is
      # only a comment). The Rust test
      # rust/tw_tests/tests/chains/bitcoin/bitcoin_sign/p2wpkh.rs asserts this
      # txid (line 82) for a byte-identical `encoded` value (line 81) built from
      # the same key, outpoints and amounts.
      txid: "5d6bf53576a54be4d92cd8abf58d28ecc9ea7956eaf970d24d6bfcb9fcfe9855"
    platforms_verified: [android, ios]

  - id: bitcoin-plan-multi_input-1
    coin: bitcoin
    operation: plan
    variant: multi_input
    source:
      kind: upstream_test
      path: tests/chains/Bitcoin/TWBitcoinSigningTests.cpp
      commit: d692ac27749d0c615e17c751b70ab4f0aa75c59b
      # TEST(BitcoinSigning, SignP2WPKH_MaxAmount), lines 1083-1115 (plan
      # assertions at 1086-1090), with the fixture buildInputP2WPKH, lines
      # 913-963. Two inputs owned by two DIFFERENT raw keys; no mnemonic or
      # derivation path exists in this test (see the report).
    input:
      hash_type: "1" # TWBitcoinSigHashTypeAll (line 1084)
      byte_fee: "1" # line 922
      # buildInputP2WPKH is called with amount 1'000 (line 1084) and the test then
      # overrides `input.amount = 1'224'999'773` (line 1085).
      amount: "1224999773"
      use_max_amount: true # buildInputP2WPKH(..., true), line 1084
      to_address: "1Bp9U1ogV3A14FMvKbRJms7ctyso4Z4Tcx" # line 923
      change_address: "1FQc5LdgGHMHEN9nwkjmz6tWkxhPpxBvBU" # line 924
      # Both keys are published as test keys by upstream's TWBitcoinSigningTests.cpp
      # (lines 927 and 933); TEST(BitcoinSigning, SignP2WPKH_Bip143) (line 829)
      # cites BIP-143 next to the same two keys.
      utxos:
        - txid: "fff7f7881a8099afa6940d42d1e7f6362bec38171ea3edf433541db4e4ad969f" # passed to OutPoint() as written (line 914), no reversal
          index: "0"
          amount: "625000000"
          sequence: "4294967295"
          # P2PK script, a literal in the test (line 950): <33-byte pubkey> OP_CHECKSIG.
          script_pub_key: "2103c9f4836b9a4f77fc0d81f7bcb01b7f1b35916864b9476c241ce9fc198bd25432ac"
          private_key: "bbc27228ddcb9209d7fd6f36b02f7dfa6252af40bb2f1cbc7a557da8027ff866" # line 927
        - txid: "ef51e1b804cc89d182d279655c3aa89e815b1b309fe287d9b2b55d57b90ec68a" # as written (line 915), no reversal
          index: "1"
          amount: "600000000"
          sequence: "4294967295"
          # P2WPKH script, a literal in the test (lines 956-957).
          script_pub_key: "00141d0f172a0ecb48aee1be1f2687d2963ae33f71a1"
          private_key: "619c335025c7f4012e556c2a58b2506e30b8511b53ade95ea316fd8c3286feb9" # line 933
      # The test also sets input.scripts["1d0f172a0ecb48aee1be1f2687d2963ae33f71a1"]
      # to Script::buildPayToPublicKeyHash(parse_hex("1d0f172a0ecb48aee1be1f2687d2963ae33f71a1"))
      # (lines 946-947), the P2PKH redeem script that the P2WPKH input is signed
      # against; the script bytes are built by the test and are not a literal.
      redeem_scripts:
        - key_hash: "1d0f172a0ecb48aee1be1f2687d2963ae33f71a1"
          script_type: "p2pkh"
    expected:
      # EXPECT_TRUE(verifyPlan(plan, {625'000'000, 600'000'000}, 1'224'999'773, 227)), line 1089.
      selected_utxo_amounts: ["625000000", "600000000"]
      amount: "1224999773"
      fee: "227"
      # Asserted through verifyPlan (tests/chains/Bitcoin/TxComparisonHelper.cpp
      # lines 104-117), not literals: sum(utxoAmounts) and
      # sum(utxoAmounts) - outputAmount - fee.
      available_amount: "1225000000"
      change: "0"
    platforms_verified: [android, ios]

  - id: bitcoin-sign-multi_input-1
    coin: bitcoin
    operation: sign
    variant: multi_input
    source:
      kind: upstream_test
      path: tests/chains/Bitcoin/TWBitcoinSigningTests.cpp
      commit: d692ac27749d0c615e17c751b70ab4f0aa75c59b
      # TEST(BitcoinSigning, SignP2WPKH_MaxAmount), lines 1083-1115 (sign
      # assertions at 1092-1114), with the fixture buildInputP2WPKH, lines
      # 913-963; the input block is identical to bitcoin-plan-multi_input-1.
      # `encoded` is the test's structured literal (lines 1103-1113) with its
      # adjacent string pieces concatenated in order and its trailing comments
      # dropped.
    input:
      hash_type: "1"
      byte_fee: "1"
      amount: "1224999773" # overridden at line 1085
      use_max_amount: true
      to_address: "1Bp9U1ogV3A14FMvKbRJms7ctyso4Z4Tcx"
      change_address: "1FQc5LdgGHMHEN9nwkjmz6tWkxhPpxBvBU"
      utxos:
        - txid: "fff7f7881a8099afa6940d42d1e7f6362bec38171ea3edf433541db4e4ad969f" # as written, no reversal
          index: "0"
          amount: "625000000"
          sequence: "4294967295"
          script_pub_key: "2103c9f4836b9a4f77fc0d81f7bcb01b7f1b35916864b9476c241ce9fc198bd25432ac"
          private_key: "bbc27228ddcb9209d7fd6f36b02f7dfa6252af40bb2f1cbc7a557da8027ff866"
        - txid: "ef51e1b804cc89d182d279655c3aa89e815b1b309fe287d9b2b55d57b90ec68a" # as written, no reversal
          index: "1"
          amount: "600000000"
          sequence: "4294967295"
          script_pub_key: "00141d0f172a0ecb48aee1be1f2687d2963ae33f71a1"
          private_key: "619c335025c7f4012e556c2a58b2506e30b8511b53ade95ea316fd8c3286feb9"
      redeem_scripts:
        - key_hash: "1d0f172a0ecb48aee1be1f2687d2963ae33f71a1"
          script_type: "p2pkh" # built by Script::buildPayToPublicKeyHash (lines 946-947)
    expected:
      encoded: ""
    platforms_verified: [android, ios]
