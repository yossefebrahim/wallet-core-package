name: wallet_core_flutter_workspace
description: >-
  Private workspace root for the wallet_core_flutter monorepo. Holds the pub
  workspace membership and the canonical melos gate scripts; ships nothing.
publish_to: none
version: 0.0.1

environment:
  # Placeholder constraint; DECISION-6 sets the supported floor.
  sdk: ^3.12.0

workspace:
  - packages/wallet_core_flutter
  - packages/wallet_core_flutter_bindings
  - packages/wallet_core_flutter_native
  - tools/inventory
  - tools/manifest
  - tools/upstream
  - tools/vectors

dev_dependencies:
  lints: ^6.0.0
  melos: 8.6.0

# A pub workspace resolves to one version per package, and melos 8.6.0 needs
# `cli_util ^0.5.0` while every published ffigen (through 21.0.0) still asks
# for `^0.4.2` — disjoint ranges, so without this the workspace cannot hold
# both the gate runner and the generator. cli_util 0.5.x is additive over the
# one thing ffigen imports from it (`Ansi`, from `cli_logging.dart`); 0.5.0
# added `BaseDirectories`, 0.5.1 the `cli_components` library, and removed
# nothing ffigen touches. Drop this when ffigen widens its constraint.
dependency_overrides:
  cli_util: ^0.5.2

melos:
  # `melos bootstrap` otherwise writes IntelliJ project files into the checkout
  # on every run; nothing in this repository depends on them.
  ide:
    intellij: false

  scripts:
    analyze:
      description: dart analyze --fatal-infos in every package.
      exec: dart analyze --fatal-infos .

    format:check:
      description: dart format --set-exit-if-changed over the whole repository.
      run: dart format --output=none --set-exit-if-changed .

    test:
      description: >-
        Unit tests in every package: flutter test in Flutter packages,
        dart test in pure-Dart packages.
      steps:
        - melos exec --flutter --dir-exists=test -- flutter test
        - melos exec --no-flutter --dir-exists=test -- dart test
    manifest:validate: dart run tools/manifest/bin/validate.dart compat_manifest.json
    upstream:fetch:
      description: >-
        Put the pinned upstream source tree into third_party/wallet-core/,
        record its schema digests in compat_manifest.json, and copy upstream's
        licence text into THIRD_PARTY_NOTICES.md. Pass --from <archive> to
        unpack a pre-fetched tarball instead of downloading.
      run: dart run tools/upstream/bin/fetch.dart
    native:host-lib:
      description: >-
        Relink upstream's macOS static archive into the host library that
        `melos run test:native` loads (DECISION-9 Option A', T1.6). Build-time
        tooling only; the output goes outside the repository. Needs the cached
        upstream release asset under $WCF_UPSTREAM_CACHE (default
        ~/.cache/wcf-upstream) and the commit pin T1.1 writes into
        compat_manifest.json; until that pin exists, call
        tools/native_build/build_apple.sh directly with --commit.
      run: >-
        tools/native_build/build_apple.sh
        --cache-dir "${WCF_UPSTREAM_CACHE:-$HOME/.cache/wcf-upstream}"
        --from-manifest compat_manifest.json
        --slices macos-arm64_x86_64
        --out-dir "${WCF_NATIVE_OUT:-${TMPDIR:-/tmp}/wcf-native}"
        --expect-symbol-count 464
    vectors:validate: dart run tools/vectors/bin/validate.dart test_vectors

    gen:ffi:
      description: >-
        Regenerate the Dart FFI bindings over upstream's public C API, refresh
        the generated symbol inventory, and format the output so the committed
        result passes format:check without an exclusion. Reads
        third_party/wallet-core-dist/include/TrustWalletCore/ — the tagged
        release asset's 143 headers, not the git tree's 67 — placed by
        `melos run upstream:fetch -- --dist-only --from-dist <asset>`.
      steps:
        - melos exec --scope="wallet_core_flutter_bindings" -- dart run ffigen --config ffigen.yaml
        - dart run tools/inventory/bin/symbols.dart
        - dart format packages/wallet_core_flutter_bindings/lib/src/generated/ffi

    inventory:check:
      description: >-
        Fail if any function or enum upstream's headers declare is missing from
        the generated bindings, or if the committed inventory.json is stale
        (PRD §9).
      run: dart run tools/inventory/bin/symbols.dart --check

    gen:all:
      description: Every generator, in dependency order.
      steps:
        - melos run gen:ffi
        - melos run gen:proto
        - melos run gen:registry

    gen:check:
      description: >-
        Regenerate everything and fail on a diff, or on a generated file that
        regeneration produced but nobody tracked — AGENTS.md rule 1, enforced
        rather than reviewed.
      steps:
        - melos run gen:all
        - git diff --exit-code -- "packages/*/lib/src/generated/" "docs/capability_matrix.*"
        # `git diff` cannot see a file that is not tracked yet, so a pin bump
        # that only *adds* a generated file (a new .proto upstream, say) would
        # pass the step above. This one catches it.
        - sh -c 'u=$(git ls-files --others --exclude-standard -- packages/*/lib/src/generated docs/capability_matrix.*); test -z "$u" || { echo "gen-check failed - generated but untracked"; echo "$u"; false; }'
