name: wallet_core_flutter_native
description: >-
  Native distribution layer of the wallet_core_flutter workspace: artifact
  acquisition and checksum verification at build time, build integration,
  library loading, and the build-identity check. See the library doc comment
  for the project disclaimer.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  # sha256 of the shipped manifest's bytes — DECISION-14 §2.3 comparison 2,
  # PRD §12.3 integrity verification. Pure Dart, no network, no wallet
  # cryptography (AGENTS.md rule 2).
  crypto: ^3.0.0
  flutter:
    sdk: flutter
  # DECISION-2 Option 1 (build hooks), evaluation branch only. `hook/build.dart`
  # imports these two and nothing under lib/ does. The floors are the oldest
  # releases whose API the hook was written against and read in source:
  # hooks 1.0.2 is the first with `output.dependencies` *and* a stable
  # protocol. They do not set the consumer's floor: `environment:` above does
  # (pub refuses this package below Flutter 3.44.0), and android_libcpp_shared
  # 0.2.1 below needs hooks ^2.0.2, so what resolves is hooks 2.0.2 (Dart
  # >=3.10). code_assets 1.x accepts both hooks 1.x (1.0.0) and 2.x (1.1.0+);
  # 2.0.0 changed the API.
  hooks: ">=1.0.2 <3.0.0"
  code_assets: ^1.0.0
  # The Flutter docs' prescription for C++ code on Android: libc++_shared.so is
  # not a system library, and one shared hook package emits it under one asset
  # id so every hook-based package that needs it dedupes to one copy. It is a
  # third-party package whose hook runs in every consumer build; it is a no-op
  # off Android. Whether our .so needs it at all waits for the first Android
  # artifact (`llvm-readelf -d` DT_NEEDED, T1.8b). 0.3.x needs hooks ^2.2.0
  # and code_assets ^2.0.0, and the workspace cannot resolve that: ffigen
  # 21.0.0 (pinned exactly by the bindings) needs code_assets ^1.1.0
  # (re-checked on Dart 3.13.4).
  android_libcpp_shared: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  assets:
    # A byte-for-byte copy of the repository's compat_manifest.json, written
    # by `melos run gen:manifest` and diffed by `gen:check`. PRD §15.3 ships
    # the manifest inside this package; the build-time fetch tool reads this
    # JSON from the package directory, and an application can read it as an
    # asset. The run-time identity check does not — it uses the generated
    # constants in lib/src/generated/manifest.dart, because it runs in a
    # worker isolate with no binary messenger (DECISION-12 §5).
    - assets/compat_manifest.json
