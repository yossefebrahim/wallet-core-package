name: wallet_core_flutter_native
description: >-
  Native distribution layer of the wallet_core_flutter workspace: artifact
  acquisition and checksum verification at build time, build integration,
  library loading, and the build-identity check. See the library doc comment
  for the project disclaimer.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  # sha256 of the shipped manifest's bytes — DECISION-14 §2.3 comparison 2,
  # PRD §12.3 integrity verification. Pure Dart, no network, no wallet
  # cryptography (AGENTS.md rule 2).
  crypto: ^3.0.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  # DECISION-2 Option 2 (evaluation branch, T1.9): conventional platform
  # packaging. An FFI plugin has no method channel and no plugin class; the
  # platform declarations exist so Flutter's tooling includes android/ as a
  # Gradle subproject and ios/ as a CocoaPods pod of the consuming app.
  #   android/build.gradle — a per-variant task obtains every android/<abi>/*.so
  #     the manifest lists through tool/fetch_artifacts.dart and adds it as a
  #     generated jniLibs directory (never the source tree).
  #   ios/wallet_core_flutter_native.podspec — at `pod install`, obtains the
  #     iOS rows through the same tool and vendors TrustWalletCore.xcframework.
  # `ffiPlugin: true` is the platform key Flutter introduced with the
  # plugin_ffi template in Flutter 3.0; it is not what sets the floor below.
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
  assets:
    # A byte-for-byte copy of the repository's compat_manifest.json, written
    # by `melos run gen:manifest` and diffed by `gen:check`. PRD §15.3 ships
    # the manifest inside this package; the build-time fetch tool reads this
    # JSON from the package directory, and an application can read it as an
    # asset. The run-time identity check does not — it uses the generated
    # constants in lib/src/generated/manifest.dart, because it runs in a
    # worker isolate with no binary messenger (DECISION-12 §5).
    - assets/compat_manifest.json
