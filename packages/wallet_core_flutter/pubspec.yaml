name: wallet_core_flutter
description: >-
  Public SDK layer of the wallet_core_flutter workspace: the stable, typed
  wallet, account, address, request, and signing surface. Placeholder scaffold;
  see the library doc comment for the project disclaimer.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  # `calloc` for the engine's secret staging buffers, which it zero-fills
  # before freeing (lib/src/engine/secret_buffers.dart). Same constraint as the
  # bindings package, so the workspace resolves one version.
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  # The runtime of the generated protobuf classes, named by the family code
  # (`GeneratedMessage`, `InvalidProtocolBufferException`) for the key-field
  # walk and output parsing (lib/src/families/). Exactly the bindings
  # package's pin: the generated classes and their runtime are a matched pair.
  protobuf: 6.0.0
  # Exact pins, never ranges: the three packages release as one verified set
  # (PRD §15.4).
  wallet_core_flutter_bindings: 0.0.1
  wallet_core_flutter_native: 0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  # The test-vector inventory loader (T0.8), so tests read
  # test_vectors/ rather than copying values out of it.
  wcf_tool_vectors:
    path: ../../tools/vectors
