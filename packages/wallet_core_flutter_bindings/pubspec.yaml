name: wallet_core_flutter_bindings
description: >-
  Generated bindings layer of the wallet_core_flutter workspace: ffigen output,
  protobuf classes, coin registry metadata, and the memory wrappers. Placeholder
  scaffold; see the library doc comment for the project disclaimer.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  # The generated bindings need `dart:ffi` and nothing else; `package:ffi`
  # (`calloc`, `Utf8`) is the memory wrappers' (T1.6): every temporary native
  # buffer they hand to upstream is allocated and freed through it. A caret
  # range rather than an exact pin, because nothing generated depends on it —
  # it is an ordinary source dependency of hand-written code, not half of a
  # generator/runtime pair like `protobuf` below.
  ffi: ^2.1.0
  # Exact pin, never a range (PRD §15.4).
  wallet_core_flutter_native: 0.0.1
  # Runtime of the protobuf classes under lib/src/generated/proto/. Exact, not
  # a range: those classes were emitted by protoc_plugin
  # compat_manifest.json:generators.protoc_gen_dart and are a matched pair with
  # the runtime that shipped alongside it. A range lets the two drift.
  protobuf: 6.0.0
  # Imported directly by the generated code (Int64 fields), so it is pinned
  # here rather than inherited transitively through protobuf.
  fixnum: 1.1.1

dev_dependencies:
  # Exactly pinned, and the same version is recorded in compat_manifest.json
  # `generators.ffigen` (PRD §15.3): the generated bindings are committed, so
  # the generator that produced them is part of the pin, not a floating range.
  ffigen: 21.0.0
  lints: ^6.0.0
  test: ^1.25.0
