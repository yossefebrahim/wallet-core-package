# ffigen configuration for the generated FFI layer (PRD §9).
#
# Regenerate with `melos run gen:ffi`; never edit the output. `melos run
# gen:check` regenerates and fails on a diff, and `melos run inventory:check`
# fails if any function or enum the headers declare is missing from the output
# (AGENTS.md rule 1).
#
# Input: `third_party/wallet-core-dist/include/TrustWalletCore/`, placed by
#   melos run upstream:fetch -- --dist-only --from-dist TrustWalletCore-<tag>.tar.xz
# That is the tagged **release asset's** header set, not the git tree's. At
# 4.8.0 the git tree ships 67 public headers and the asset ships 143; the extra
# 76 are produced by upstream's own build (Ruby codegen, a C++ protobuf build,
# and codegen-v2 in Rust), which we do not run. The 67 common to both are
# byte-identical, and the asset's set declares the same 464 `TW*` functions the
# shipped framework exports — the same list `tools/native_build/` uses for the
# linker's `-u` list and the export gate, so the bindings and that gate cannot
# disagree. See `tools/upstream/README.md` and
# `docs/decisions/evidence/headers-4.8.0-source-vs-binary.md`.

name: WalletCoreBindings
description: >-
  Generated Dart FFI bindings for the public C API of the open-source Trust
  Wallet Core library. Unofficial; not affiliated with or endorsed by Trust
  Wallet.

output: 'lib/src/generated/ffi/wallet_core_bindings.dart'

headers:
  entry-points:
    - '../../third_party/wallet-core-dist/include/TrustWalletCore/*.h'
  # `TWBase.h` pulls in <stdlib.h>, <stdint.h>, <stdbool.h> and <stddef.h>.
  # Without this, ffigen would bind the host libc's declarations too — malloc,
  # abort, and a platform-dependent set of typedefs that would make the
  # committed output differ between macOS and Linux and break `gen:check`.
  include-directives:
    - '**/TrustWalletCore/*.h'

# The 62 `HRP_*` and `TWStellarPassphrase_*` declarations in the headers are
# `static const char *` initialisers — internal linkage, so they are not
# symbols the library exports and `_lookup` would throw on first access. PRD §9
# asks for every declared *function and enum*; the string values themselves are
# visible in the headers and, for the HRPs, in the generated registry (T1.5).
globals:
  exclude:
    - '.*'

# A `NativeFinalizer` needs the raw address of the delete function, because its
# callback is upstream's delete function itself and no Dart code may run in it
# (PRD §11.2 item 5). ffigen emits an `addresses` member only for the names
# listed here, so exactly the delete functions some wrapper attaches are listed
# — the memory wrappers' two and the SDK engine's four (T1.11) — and every
# other function stays a call-only binding. Keep this list minimal: each entry
# adds a `Pointer<NativeFunction<…>>` field to the generated class.
#
# `symbol-address` is a member of `functions:`, not a top-level key; ffigen
# ignores it silently at the top level. Nothing else is set under `functions:`,
# so the include/exclude defaults are unchanged and all 466 declared functions
# are still bound (`melos run inventory:check`).
functions:
  symbol-address:
    include:
      - TWAnyAddressDelete
      - TWDataDelete
      - TWHDWalletDelete
      - TWPrivateKeyDelete
      - TWPublicKeyDelete
      - TWStringDelete

# Bindings are name-sorted rather than left in source order: the entry points
# come from a glob, and a glob's order is the filesystem's. Sorting is what
# makes a second `gen:ffi` on the same input produce the same bytes on a
# different machine, which is the whole point of `gen:check`.
sort: true

# Upstream's headers are C. Saying so keeps clang from applying C++ rules to
# `TW_EXTERN_C_BEGIN`-wrapped declarations.
language: c

# Upstream marks its enums with `TW_EXPORT_ENUM(uint32_t)`, which expands to
# nothing, so they are plain C enums whose underlying type clang picks. ffigen
# warns about that for every one of the 19; the warning is expected and says
# nothing we can act on from here.
silence-enum-warning: true

# libclang. The macOS entry is the Command Line Tools path used by developers
# and by the macOS CI runners; the rest are where Debian/Ubuntu put it, so one
# config generates the same bindings on either.
llvm-path:
  - '/Library/Developer/CommandLineTools/usr/lib'
  - '/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib'
  - '/usr/lib/llvm-18/lib'
  - '/usr/lib/llvm-17/lib'
  - '/usr/lib/llvm-16/lib'
  - '/usr/lib/llvm-15/lib'
  - '/usr/lib/llvm-14/lib'
  - '/usr/lib'

# Emitted above ffigen's own header. ffigen already writes
# `// ignore_for_file: type=lint, unused_import, unused_element,
# deprecated_member_use_from_same_package`, which is enough for
# `dart analyze --fatal-infos` under this repository's lints — so nothing is
# added here, and `lib/src/generated/**` is *not* excluded from analysis.
# Repeating any of those names would itself trip `duplicate_ignore`.
preamble: |
  // GENERATED FILE — DO NOT EDIT.
  //
  // Regenerate with `melos run gen:ffi`. Edits here are erased by the next
  // run and are caught by `melos run gen:check` (AGENTS.md rule 1).
  //
  // Dart FFI bindings for the public C API of the open-source Trust Wallet
  // Core library, generated by package:ffigen from the headers of the pinned
  // release asset. Provenance — archive, checksum, tag, commit, and the
  // digest of the header set — is recorded in
  // `lib/src/generated/inventory.json`, which also proves every declared
  // function and enum below is bound.
  //
  // Unofficial Dart/Flutter SDK for the open-source Trust Wallet Core
  // library. Not affiliated with or endorsed by Trust Wallet.
