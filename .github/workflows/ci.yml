name: CI

# The `gates` job runs the four canonical gates of AGENTS.md ("Canonical gates")
# with the same commands a developer runs locally, in the same order, so that a
# green local run and a green CI run mean the same thing (PRD §15.2).

on:
  push:
  pull_request:
  workflow_dispatch:

# One run per ref: a new push supersedes the run it interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Gates (analyze, format, test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Put the pub global bin directory on PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Activate melos
        run: dart pub global activate melos 8.6.0

      - name: melos bootstrap
        run: melos bootstrap

      - name: melos run analyze
        run: melos run analyze

      - name: melos run format:check
        run: melos run format:check

      - name: melos run test
        run: melos run test

      - name: melos run lint:public-api
        run: melos run lint:public-api

      - name: melos run vectors:validate
        run: melos run vectors:validate

      # Non-strict and fast: a checkout has no device results, so a claim with
      # no results file is only reported. The `matrix` job below runs the
      # strict check over the real device results.
      - name: melos run matrix:check
        run: melos run matrix:check

      - name: melos run lint:runtime-deps
        run: melos run lint:runtime-deps

      # The lockfile is committed; bootstrap must not change the resolution.
      - name: Check pubspec.lock is unchanged
        run: git diff --exit-code pubspec.lock

  # AGENTS.md rule 1 — "generated directories are never hand-edited" — enforced
  # rather than reviewed. The job reproduces both generator inputs from the pin
  # in `compat_manifest.json`, regenerates everything, and fails on a diff.
  #
  # Two archives, because they are two different things: the source tree
  # (`src/proto`, `registry.json`) feeds T1.4 and T1.5, and the tagged release
  # asset's 143 public headers feed ffigen. The git tree ships only 67 of those
  # headers; the other 76 are produced by upstream's own build. Both URLs are
  # built from `upstream.repo` and `upstream.tag` by pure functions in
  # `tools/upstream/lib/`, so what CI fetches is decided by the manifest.
  generated:
    name: Generated code (gen:check, inventory:check)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      # ffigen needs libclang to parse upstream's headers. The paths installed
      # here are among the `llvm-path` entries in
      # `packages/wallet_core_flutter_bindings/ffigen.yaml`.
      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libclang-dev

      - name: Put the pub global bin directory on PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Activate melos
        run: dart pub global activate melos 8.6.0

      - name: melos bootstrap
        run: melos bootstrap

      # `gen:proto` (tools/gen/proto.sh) refuses to run unless the protoc and
      # protoc-gen-dart on PATH are exactly the versions compat_manifest.json
      # pins (`generators.protoc`, `generators.protoc_gen_dart`); a bump of
      # either pin without a matching bump here therefore fails this job
      # loudly rather than regenerating with the wrong tool. Ubuntu's
      # protobuf-compiler package is older and unpinned, so protoc comes from
      # the protocolbuffers/protobuf release asset. The sha256 is FIRST-SEEN
      # (orchestrator, 2026-09-08, downloaded once and hashed): protobuf
      # publishes no checksums for its release zips.
      - name: Install protoc 33.4 (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -sSL --retry 3 -o "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v33.4/protoc-33.4-linux-x86_64.zip
          echo "c0040ea9aef08fdeb2c74ca609b18d5fdbfc44ea0042fcfbfb38860d35f7dd66  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/protoc"
          unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$HOME/.local/protoc"
          echo "$HOME/.local/protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.local/protoc/bin/protoc" --version

      # The launcher `dart pub global activate` writes records the version;
      # proto.sh reads it back, so the pin is checked from the file protoc will
      # actually execute.
      - name: Activate protoc_plugin 25.0.0 (pinned)
        run: dart pub global activate protoc_plugin 25.0.0

      # `--dist` fetches the release asset as well as the source tree. The
      # commit is already pinned in the manifest, so the fetch verifies it
      # rather than setting it.
      - name: Fetch the pinned upstream source tree and release asset
        run: melos run upstream:fetch -- --dist

      # The fetch writes the schema digests; a change there means the pin moved
      # under us, which is a separate failure from a stale generated file.
      - name: Check the manifest is unchanged by the fetch
        run: git diff --exit-code compat_manifest.json THIRD_PARTY_NOTICES.md

      - name: melos run gen:check
        run: melos run gen:check

      - name: melos run inventory:check
        run: melos run inventory:check

      - name: melos run manifest:validate
        run: melos run manifest:validate

  native:
    name: Native tests
    runs-on: macos-latest
    env:
      UPSTREAM_TAG: "4.8.0"
      UPSTREAM_TARBALL_SHA256: "30b0532d9f143b6409aa405f3ba124625fb01e70f13d8e52b3904334c617ff60"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Put the pub global bin directory on PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Activate melos
        run: dart pub global activate melos 8.6.0

      - name: melos bootstrap
        run: melos bootstrap

      - name: Fetch upstream 4.8.0 release asset (FIRST-SEEN digest)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/wcf-upstream/$UPSTREAM_TAG"
          curl -sSL --retry 3 -o "$HOME/.cache/wcf-upstream/$UPSTREAM_TAG/TrustWalletCore-$UPSTREAM_TAG.tar.xz" \
            "https://github.com/trustwallet/wallet-core/releases/download/$UPSTREAM_TAG/TrustWalletCore-$UPSTREAM_TAG.tar.xz"
          echo "$UPSTREAM_TARBALL_SHA256  $HOME/.cache/wcf-upstream/$UPSTREAM_TAG/TrustWalletCore-$UPSTREAM_TAG.tar.xz" | shasum -a 256 -c -

      - name: Build host library
        run: |
          melos run native:host-lib -- --expected-tarball-sha256 "$UPSTREAM_TARBALL_SHA256"

      # test:native must run before test:no-network to warm the build-hook artifact cache
      - name: melos run test:native
        run: melos run test:native

      - name: melos run test:no-network
        run: melos run test:no-network

  # The device jobs run example/integration_test (the M0 flow, through the
  # public surface) on a real emulator / simulator. They are slow and cost
  # runner minutes, so they run on a push to main and on demand, not on every
  # pull request. Both go through `tools/device_test.sh`, which refuses to pick
  # a device: the job names it. No `offline` or `vendored_dir` user-define is
  # set: on an artifact-cache miss (the first run for a manifest, or after
  # eviction) these jobs exercise the real build-hook fetch of the release
  # asset; on a hit the hook re-hashes the restored file against the manifest
  # and downloads nothing. `tools/consumer_check.sh` exercises the fetch on
  # every local run.
  # The artifact cache below is safe because the hook hashes whatever it
  # bundles against the manifest's sha256 and size, whether it came from the
  # cache or the network.
  android-emulator:
    name: Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      WCF_ANDROID_DEVICE: emulator-5554
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The hosted runner has /dev/kvm but not world-accessible; the emulator
      # needs it for x86_64 hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Put the pub global bin directory on PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Activate melos
        run: dart pub global activate melos 8.6.0

      - name: melos bootstrap
        run: melos bootstrap

      - name: Cache the verified native artifacts
        uses: actions/cache@v6
        with:
          path: example/.dart_tool/hooks_runner/shared/wallet_core_flutter_native/build/artifacts
          key: wcf-artifacts-android-${{ hashFiles('compat_manifest.json') }}

      - name: Cache the AVD snapshot
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-35-google_apis-x86_64-v1

      # On a cache miss, boot once to create the AVD and its quick-boot
      # snapshot; the cache step saves both when the job ends.
      - name: Create the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated the AVD snapshot for caching."

      # The first execution of the x86_64 library on a device: a failure here
      # is a finding about the artifact, not something this job works around.
      # `tools/ci/android_device_diag.sh` runs what `melos run test:android`
      # runs (`tools/device_test.sh android`, verbose), one integration-test
      # file per `flutter test` run, each under a 10-minute kill, inside a
      # 20-minute total budget; a file whose run failed to attach before any
      # test ran ("Failed to start Dart Development Service") is retried once.
      # It records logcat, a heartbeat and the post-run device state into
      # DIAG_DIR, so a hang fails with evidence instead of a silent job timeout.
      # The step's 30 minutes are the 20-minute budget plus up to 10 minutes of
      # post-run collection, so the script's summary always prints.
      # It is one command because the runner action executes each `script`
      # line as its own `sh -c`.
      - name: Android M0 flow (test:android under diagnostics)
        timeout-minutes: 30
        env:
          DIAG_DIR: ${{ runner.temp }}/android-diag
          # flutter/flutter#192736: on x86_64 Linux hosts with SwiftShader,
          # Impeller's OpenGL ES backend (always used on emulators since Flutter
          # 3.44) kills or stalls the emulator. `--no-enable-impeller` launches
          # this test run without Impeller; the workaround is scoped to this CI
          # lane only. Remove it when the upstream issue is fixed.
          WCF_TEST_EXTRA: --no-enable-impeller
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/ci/android_device_diag.sh

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-diag
          path: ${{ runner.temp }}/android-diag
          if-no-files-found: warn

      # The device test prints one WCF_VECTOR_RESULT line per proven vector;
      # the collector turns the logs into android.json. The logs are one per
      # file (flutter_test_<name>.txt and, for a retry,
      # flutter_test_<name>.retry.txt), all matched by the glob below. It runs
      # after a failed test too: a partial run records what passed, and the
      # `matrix` job then fails on every claim the file lacks.
      - name: Collect Android vector results
        if: always()
        env:
          DIAG_DIR: ${{ runner.temp }}/android-diag
          RESULTS_DIR: ${{ runner.temp }}/vector-results
        run: |
          set -euo pipefail
          shopt -s nullglob
          logs=("$DIAG_DIR"/flutter_test*.txt)
          if [ "${#logs[@]}" -eq 0 ]; then
            echo "::error::No flutter_test*.txt in $DIAG_DIR: the device test left no log to collect results from."
            exit 1
          fi
          melos run matrix:collect -- --platform android --out "$RESULTS_DIR" "${logs[@]}"

      - name: Upload Android vector results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-results-android
          path: ${{ runner.temp }}/vector-results/android.json
          if-no-files-found: error

  ios-simulator:
    name: iOS simulator
    runs-on: macos-26
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Put the pub global bin directory on PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Activate melos
        run: dart pub global activate melos 8.6.0

      - name: melos bootstrap
        run: melos bootstrap

      - name: Cache the verified native artifacts
        uses: actions/cache@v6
        with:
          path: example/.dart_tool/hooks_runner/shared/wallet_core_flutter_native/build/artifacts
          key: wcf-artifacts-ios-${{ hashFiles('compat_manifest.json') }}

      - name: Select the pinned Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      # Exactly one simulator: this name on this runtime. Nothing is picked by
      # "first available", so a runner-image change fails loudly here instead
      # of moving the test to a different device.
      - name: Boot the simulator
        env:
          SIM_NAME: iPhone 17
          SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j \
            | jq -r --arg name "$SIM_NAME" --arg rt "$SIM_RUNTIME" \
                '(.devices[$rt] // []) | map(select(.name == $name)) | .[0].udid // empty')"
          if [ -z "$udid" ]; then
            echo "::error::No available simulator named '$SIM_NAME' on runtime $SIM_RUNTIME. Installed:"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "WCF_IOS_DEVICE=$udid" >> "$GITHUB_ENV"

      # `tools/ci/ios_device_diag.sh` runs what `melos run test:ios` runs
      # (`tools/device_test.sh ios`), one integration test file at a time, each
      # verbose and under its own 12-minute watchdog, while recording the
      # simulator log, a heartbeat and, on a timeout, a stack sample and a
      # screenshot into DIAG_DIR, so a hang fails with evidence instead of a
      # silent job timeout.
      - name: iOS M0 flow (test:ios under diagnostics)
        timeout-minutes: 35
        env:
          DIAG_DIR: ${{ runner.temp }}/ios-diag
        run: bash tools/ci/ios_device_diag.sh

      - name: Upload iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-diag
          path: ${{ runner.temp }}/ios-diag
          if-no-files-found: warn

      # As for Android: one ios.json from the per-file logs
      # (flutter_test_<name>.txt and, for a retry, flutter_test_<name>.retry.txt).
      - name: Collect iOS vector results
        if: always()
        env:
          DIAG_DIR: ${{ runner.temp }}/ios-diag
          RESULTS_DIR: ${{ runner.temp }}/vector-results
        run: |
          set -euo pipefail
          shopt -s nullglob
          logs=("$DIAG_DIR"/flutter_test*.txt)
          if [ "${#logs[@]}" -eq 0 ]; then
            echo "::error::No flutter_test*.txt in $DIAG_DIR: the device test left no log to collect results from."
            exit 1
          fi
          melos run matrix:collect -- --platform ios --out "$RESULTS_DIR" "${logs[@]}"

      - name: Upload iOS vector results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-results-ios
          path: ${{ runner.temp }}/vector-results/ios.json
          if-no-files-found: error

  # The strict coverage check (PRD §13.2) over the device results: every
  # `platforms_verified` claim must be `pass` in the results the two device
  # jobs just produced, the committed matrix must equal a regeneration, and no
  # level may have gone down against the previous main. It runs after a failed
  # device job too (`always()`), because a missing or partial results file is
  # exactly what it reports. Same events as the device jobs.
  matrix:
    name: Capability matrix (matrix:check --strict)
    runs-on: ubuntu-latest
    needs: [android-emulator, ios-simulator]
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    env:
      # Check (c) compares with the matrix before this change. On a push to
      # main `origin/main` is already the pushed commit, so the baseline is the
      # tip before the push; a manual run compares with `origin/main`.
      BASELINE_REF: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The baseline is a commit of main's history; a shallow clone has none.
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Put the pub global bin directory on PATH
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Activate melos
        run: dart pub global activate melos 8.6.0

      - name: melos bootstrap
        run: melos bootstrap

      # `merge-multiple` puts android.json and ios.json side by side. A device
      # job that produced no artifact leaves its file out, and --strict then
      # fails on every claim for that platform.
      - name: Download the device vector results
        uses: actions/download-artifact@v4
        with:
          pattern: vector-results-*
          path: test_vectors/results
          merge-multiple: true

      - name: List the results
        run: ls -l test_vectors/results

      - name: melos run matrix:check (strict)
        run: melos run matrix:check -- --strict --baseline-ref "$BASELINE_REF"
